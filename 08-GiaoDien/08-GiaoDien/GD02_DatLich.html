<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD02 – Đặt lịch</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
function sb(f,v){const b=s.b;b[f]=v;if(f=='spec'){b.doc=DOC[v][0];b.slot=''}if(f=='doc'||f=='date')b.slot='';save();render()}
layout(2,()=>{const b=s.b;return `<h2>2. Đặt lịch khám</h2><div class="card"><div class="g2"><div><label>Chuyên khoa</label><select onchange="sb('spec',this.value)">${opts(Object.keys(DOC),b.spec)}</select></div><div><label>Bác sĩ</label><select onchange="sb('doc',this.value)">${opts(DOC[b.spec],b.doc)}</select></div><div><label>Ngày</label><input type="date" value="${b.date}" onchange="sb('date',this.value)"></div></div><label>Khung giờ</label><div class="slots">${T.map(t=>{const x=bk(b.doc,b.date,t);return `<button class="${b.slot==t?'on':''}" onclick="${x?`wl('${t}')`:`sb('slot','${t}')`}">${t}${x?' · đầy, vào danh sách chờ':''}</button>`}).join('')}</div><label>Lý do khám</label><input value="${b.reason}" oninput="s.b.reason=this.value;save()" placeholder="Ví dụ: đau đầu, sốt nhẹ">${b.re?`<p class="mu">Đang đổi lịch ${b.re}: lịch cũ sẽ được hủy và giải phóng khung giờ.</p>`:''}<label><input type="checkbox" style="width:auto" ${s.smsFail?'checked':''} onchange="s.smsFail=this.checked;save()"> Giả lập lỗi dịch vụ SMS</label><div class="row"><button class="pr" onclick="book()">Xác nhận đặt lịch</button></div></div>`});
function book(){const b=s.b;if(!b.slot)return toast('Vui lòng chọn khung giờ');
 if(s.ap.some(a=>!['Đã hủy','Không đến','Danh sách chờ'].includes(a.st)&&a.date==b.date&&a.time==b.slot&&a.id!=b.re))return toast('Bạn đã có lịch khác trùng giờ này');
 if(b.slot=='09:30'&&!s.raced){s.raced=true;s.taken[b.doc+b.date+'09:30']=1;b.slot='';save();toast('Khung giờ vừa bị người khác đặt, vui lòng chọn lại');return render()}
 if(b.re){const o=s.ap.find(a=>a.id==b.re);o.st='Đã hủy';delete s.taken[k(o)]}
 const a=addAp(b.doc,b.spec,b.date,b.slot,b.reason||'(không ghi)','Chờ xác nhận');log('Đặt lịch',a.id);s.sms.push({a:a.id,st:s.smsFail?'RETRYING':'SENT'});
 s.b={...b,slot:'',reason:'',re:null};nav(3,s.smsFail?'Đã tạo lịch. SMS lỗi tạm thời, đưa vào hàng đợi gửi lại':'Đã giữ chỗ và gửi SMS xác nhận')}
function wl(t){const b=s.b;if(s.ap.some(a=>a.st=='Danh sách chờ'&&a.doc==b.doc&&a.date==b.date&&a.time==t))return toast('Bạn đã có trong danh sách chờ khung này');s.ap.push({id:'LH'+(++s.n),doc:b.doc,spec:b.spec,date:b.date,time:t,reason:b.reason||'(không ghi)',st:'Danh sách chờ'});log('Vào danh sách chờ',b.doc+' '+t);nav(3,'Khung giờ đã đầy, bạn được đưa vào danh sách chờ')}

</script></body></html>
