<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD01 – Đăng nhập</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(1,()=>`<h2>1. Đăng nhập</h2><div class="hero"><div class="hl"><h1>Chăm sóc sức khỏe,<br>đặt lịch dễ dàng</h1><p>Đặt lịch trực tuyến, hồ sơ bệnh án điện tử và thanh toán trong một hệ thống.</p><div class="pts"><span>✔ Nhắc lịch khám qua SMS</span><span>✔ Bệnh án được khóa và ghi nhật ký</span><span>✔ Phân quyền theo vai trò (RBAC)</span><span>✔ Cảnh báo dị ứng khi kê đơn</span></div></div><div class="card"><label>Tài khoản</label><input id="u" value="demo"><label>Mật khẩu</label><input id="p" type="password" value="123456"><label>Vai trò (phân quyền RBAC)</label><select id="r">${Object.keys(ROLES).map(x=>`<option value="${x}">${ROLES[x].n}</option>`).join('')}</select><div class="row"><button class="pr" onclick="login()">Đăng nhập</button><button onclick="toast('Đã gửi liên kết đặt lại mật khẩu qua email')">Quên mật khẩu</button></div><p class="mu">Bệnh nhân (2, 3), lễ tân (2, 3, 4), bác sĩ (4, 5, 6), KTV (5), thu ngân (7), quản lý (8).</p></div></div>`);
function login(){s.role=$('r').value;log('Đăng nhập',$('u').value);nav(ROLES[s.role].s[0],'Đăng nhập thành công')}

</script></body></html>
