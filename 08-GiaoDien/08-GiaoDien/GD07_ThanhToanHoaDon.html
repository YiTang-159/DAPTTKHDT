<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD07 – Thanh toán và hóa đơn</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(7,()=>{if(!s.cur)return '<h2>7. Thanh toán</h2><div class="card mu">Chưa có lượt khám để thanh toán.</div>';const L=lines(),tot=L.reduce((a,x)=>a+x[1],0);
 return `<h2>7. Thanh toán và hóa đơn</h2><div class="card"><div class="tw"><table><tr><th>Khoản</th><th>Thành tiền</th></tr>${L.map(x=>`<tr><td>${x[0]}</td><td>${fmt(x[1])}</td></tr>`).join('')}<tr><th>Tổng tiền</th><th>${fmt(tot)}</th></tr></table></div><label>Phương thức</label><select onchange="s.pm=this.value;save();render()">${opts(['Tiền mặt','Thẻ','Chuyển khoản','Ví điện tử'],s.pm)}</select>${s.pm!='Tiền mặt'?`<label><input type="checkbox" style="width:auto" ${s.fail?'checked':''} onchange="s.fail=this.checked;save()"> Giả lập lỗi từ cổng thanh toán</label>`:`<label>Số tiền thu</label><input type="number" value="${s.cash}" oninput="s.cash=this.value;save()" onchange="render()"><p class="mu">Tiền thối: ${s.cash?fmt(Math.max(0,s.cash-tot)):'—'}</p>`}${s.pst?`<p><span class="tag ${s.paid?'g':'x'}">${s.pst}</span></p>`:''}<div class="row"><button class="pr" ${s.paid?'disabled':''} onclick="pay(${tot})">Xác nhận thanh toán</button><button ${s.paid?'':'disabled'} onclick="toast('Đã gửi lệnh in hóa đơn')">In hóa đơn</button></div></div>`});
function pay(t){if(s.pm=='Tiền mặt'&&+s.cash<t)return toast('Số tiền thu chưa đủ');if(s.pm=='Tiền mặt'||!s.fail){s.paid=true;s.pst='Thanh toán thành công · hóa đơn ĐÃ THANH TOÁN';log('Thanh toán '+s.pm,fmt(t))}else{s.pst='Giao dịch thất bại: thử lại hoặc đổi phương thức';log('Thanh toán thất bại',s.pm)}save();render()}

</script></body></html>
