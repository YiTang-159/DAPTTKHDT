<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khám bệnh và xét nghiệm · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(5,()=>s.role==='ktv'?technicianScreen():doctorScreen());
function technicianScreen(){const orders=Object.entries(s.visits).flatMap(([id,v])=>v.labs.map(l=>({...l,appointmentId:id})));return `<div class="card"><div class="heading-row"><h2>Danh sách chỉ định xét nghiệm</h2>${pill(orders.length+' chỉ định')}</div><p class="section-lead">Tài khoản kỹ thuật viên chỉ xem chỉ định và kết quả xét nghiệm, không hiển thị chẩn đoán hoặc đơn thuốc.</p><div class="table-wrap"><table><thead><tr><th>Lượt khám</th><th>Xét nghiệm</th><th>Trạng thái</th><th>Kết quả</th><th>Thao tác</th></tr></thead><tbody>${orders.map(l=>{const type=LABS.find(x=>x.id===l.type);return `<tr><td>${l.appointmentId}</td><td>${escapeHTML(type?.name||'—')}</td><td>${pill(LAB_STATES[l.status]||l.status)}</td><td>${l.status==='IN_PROGRESS'?`<input aria-label="Kết quả ${escapeHTML(type?.name)}" id="result-${l.id}" value="${escapeHTML(l.result)}" placeholder="Nhập kết quả" oninput="saveResultDraft('${l.appointmentId}','${l.id}',this.value)">`:escapeHTML(l.result||'—')}</td><td>${l.status==='ORDERED'?`<button class="btn btn-primary btn-small" onclick="nextLab('${l.appointmentId}','${l.id}')">Đã lấy mẫu</button>`:l.status==='SAMPLE_COLLECTED'?`<button class="btn btn-primary btn-small" onclick="nextLab('${l.appointmentId}','${l.id}')">Bắt đầu xét nghiệm</button>`:l.status==='IN_PROGRESS'?`<button class="btn btn-primary btn-small" onclick="nextLab('${l.appointmentId}','${l.id}')">Lưu kết quả</button>`:'<span class="muted">—</span>'}</td></tr>`}).join('')||'<tr><td colspan="5" class="table-empty">Chưa có chỉ định xét nghiệm.</td></tr>'}</tbody></table></div></div>${msgBox('Dữ liệu xét nghiệm trên trang này chỉ phục vụ minh họa quy trình UML, không dùng để kết luận sức khỏe.','warning')}`}
function doctorScreen(){const list=s.ap.filter(a=>a.status==='Đã đến'||(a.status==='Hoàn thành'&&visitFor(a.id)));const id=s.activeVisit||list[0]?.id;const a=apById(id);const v=id?visitFor(id):null;
if(!a||!v)return `<div class="card">${empty('Chưa có lượt khám đang xử lý. Vào Danh sách chờ khám và nhấn Bắt đầu khám.')}<div class="actions"><button class="btn btn-primary" onclick="go(4)">Mở danh sách chờ khám</button></div></div>`;
s.activeVisit=id;const disabled=v.closed?'disabled':'';return `<div class="card"><div class="record-header"><div><span class="person">${escapeHTML(PATIENT.name)}</span> <span class="muted">${PATIENT.id} · ${PATIENT.dob}</span><div class="muted">Lượt khám ${id} · BS ${escapeHTML(a.doctor)}</div></div>${v.closed?pill('Hoàn thành'):pill('Đang khám')}</div><div class="grid2"><div class="form-field"><label for="symptoms">Triệu chứng</label><textarea id="symptoms" ${disabled} oninput="setVisitField('symptoms',this.value)" placeholder="Nhập triệu chứng">${escapeHTML(v.symptoms)}</textarea></div><div class="form-field"><label for="diagnosis">Chẩn đoán</label><textarea id="diagnosis" ${disabled} oninput="setVisitField('diagnosis',this.value)" placeholder="Mã ICD và diễn giải ngắn">${escapeHTML(v.diagnosis)}</textarea></div></div>${msgBox('Dị ứng đã khai báo trong hồ sơ mẫu: '+PATIENT.allergy+'. Cần đối chiếu khi kê đơn.','warning')}</div>
<div class="card"><div class="heading-row"><h2>Chỉ định và kết quả xét nghiệm</h2><span class="muted">Các chỉ định có thể được thực hiện song song</span></div><div class="actions" style="margin:0 0 14px">${LABS.map(l=>`<button class="btn btn-small" ${disabled||v.labs.some(x=>x.type===l.id&&x.status!=='CANCELLED')?'disabled':''} onclick="addOrder('${l.id}')">+ ${escapeHTML(l.name)}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>Xét nghiệm</th><th>Trạng thái</th><th>Kết quả</th><th>Thao tác</th></tr></thead><tbody>${v.labs.map(l=>`<tr><td>${escapeHTML(LABS.find(x=>x.id===l.type)?.name)}</td><td>${pill(LAB_STATES[l.status])}</td><td>${escapeHTML(l.result||'—')}</td><td>${l.status==='RESULT_AVAILABLE'?`<button class="btn btn-primary btn-small" onclick="reviewLab('${l.id}')">Đã xem kết quả</button>`:!v.closed&&['ORDERED','SAMPLE_COLLECTED'].includes(l.status)?`<button class="btn btn-danger btn-small" onclick="cancelOrder('${l.id}')">Hủy chỉ định</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="table-empty">Chưa có xét nghiệm được chỉ định.</td></tr>'}</tbody></table></div><p class="hint">Kỹ thuật viên sử dụng tài khoản <b>ktv</b> để lấy mẫu, thực hiện và nhập kết quả. Bác sĩ xác nhận đã xem kết quả trước khi kết thúc khám.</p></div>
<div class="card"><div class="heading-row"><h2>Hoàn tất hồ sơ</h2>${v.rxIssued?pill('Đơn đã phát hành'):pill('Kê đơn nếu cần')}</div><div class="form-field" style="max-width:320px"><label for="followup">Ngày tái khám (không bắt buộc)</label><input id="followup" type="date" min="${TODAY}" value="${escapeHTML(v.followup)}" ${disabled} onchange="setVisitField('followup',this.value)"></div><div class="actions"><button class="btn btn-outline" onclick="go(6)">Chuyển sang kê đơn →</button><button class="btn btn-primary" ${disabled} onclick="finishVisit()">Lưu và hoàn tất khám</button></div><p class="hint">Có thể kê đơn trước, rồi quay lại màn hình này để hoàn tất lượt khám. Nếu không cần thuốc, bác sĩ có thể hoàn tất trực tiếp.</p></div>`}
function setVisitField(key,value){const v=currentVisit();if(!v||v.closed||s.role!=='bs')return;v[key]=value;save()}
function addOrder(type){const v=currentVisit();if(!v||v.closed||s.role!=='bs')return;if(v.labs.some(x=>x.type===type&&x.status!=='CANCELLED'))return notify('Xét nghiệm này đã được chỉ định');v.labs.push({id:'XN'+s.nextLab++,type,status:'ORDERED',result:''});audit('Chỉ định xét nghiệm',type+' · '+v.id);save();render()}
function labByIds(id,labId){return visitFor(id)?.labs.find(x=>x.id===labId)}
function saveResultDraft(id,labId,value){if(s.role!=='ktv')return;const l=labByIds(id,labId);if(l&&l.status==='IN_PROGRESS'){l.result=value.slice(0,300);save()}}
function nextLab(id,labId){if(s.role!=='ktv')return;const l=labByIds(id,labId);if(!l)return;const next={ORDERED:'SAMPLE_COLLECTED',SAMPLE_COLLECTED:'IN_PROGRESS',IN_PROGRESS:'RESULT_AVAILABLE'}[l.status];if(!next)return;if(next==='RESULT_AVAILABLE'&&!l.result.trim())return notify('Cần nhập kết quả trước khi lưu');l.status=next;audit('Cập nhật xét nghiệm',id+' · '+labId+' · '+next);save();render()}
function reviewLab(labId){if(s.role!=='bs')return;const v=currentVisit(),l=v?.labs.find(x=>x.id===labId);if(!l||l.status!=='RESULT_AVAILABLE')return;l.status='REVIEWED';audit('Bác sĩ đọc kết quả',labId);save();render()}
function cancelOrder(labId){if(s.role!=='bs')return;const v=currentVisit(),l=v?.labs.find(x=>x.id===labId);if(!l||!['ORDERED','SAMPLE_COLLECTED'].includes(l.status))return;if(!confirm('Hủy chỉ định xét nghiệm?'))return;l.status='CANCELLED';audit('Hủy chỉ định',labId);save();render()}
function finishVisit(){if(s.role!=='bs')return;const v=currentVisit(),a=activeAp();if(!v||v.closed||!a)return;if(!v.symptoms.trim()||!v.diagnosis.trim())return notify('Vui lòng nhập triệu chứng và chẩn đoán.');if(v.labs.some(l=>!['REVIEWED','CANCELLED'].includes(l.status)))return notify('Vẫn có xét nghiệm chưa được bác sĩ đọc hoặc chưa hoàn tất.');v.closed=true;a.status='Hoàn thành';audit('Hoàn tất lượt khám',a.id);save();render();notify('Đã hoàn tất hồ sơ. Thu ngân có thể lập hóa đơn.')}
</script></body></html>
