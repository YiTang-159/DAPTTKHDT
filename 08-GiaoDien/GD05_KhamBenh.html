<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD05 – Khám và bệnh án</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(5,()=>{if(!s.cur)return '<h2>5. Khám và bệnh án</h2><div class="card mu">Chọn bệnh nhân từ màn 4 (Bắt đầu khám).</div>';const L=s.labs,all=L.length&&L.every(x=>x.i>=3||x.x),dis=s.locked?'disabled':'';
 return `<h2>5. Khám và bệnh án</h2><div class="card"><b>${PT.name}</b> · ${PT.id} · ${PT.dob}<br><span class="tag x">Dị ứng: ${PT.allergy}</span>${s.locked?' <span class="tag g">Bệnh án đã khóa</span>':''}<label>Triệu chứng</label><textarea rows="2" ${dis} oninput="s.sym=this.value;save()">${s.sym}</textarea><label>Chẩn đoán (mã ICD, mô tả)</label><input ${dis} value="${s.dx}" oninput="s.dx=this.value;save()" placeholder="Ví dụ: J06.9 – Viêm đường hô hấp trên"></div>
 <div class="card"><b>Chỉ định xét nghiệm (chạy song song)</b><div class="row">${LAB.map((x,i)=>`<button ${dis} ${L.find(l=>l.n==x[0])?'disabled':''} onclick="addLab(${i})">+ ${x[0]}</button>`).join('')}</div>${L.length?`<div class="tw"><table><tr><th>Xét nghiệm</th><th>Trạng thái</th><th>Kết quả</th><th>Thao tác</th></tr>${L.map((l,j)=>`<tr><td>${l.n}</td><td><span class="tag ${l.x?'x':l.i>=3?'g':''}">${l.x?'Đã hủy chỉ định':LST[l.i]}</span></td><td>${!l.x&&l.i>=3?'Bình thường':'—'}</td><td><button ${l.x||l.i>=3||!kt()?'disabled':''} title="Chỉ KTV xét nghiệm được cập nhật" onclick="s.labs[${j}].i++;log('Cập nhật xét nghiệm','${l.n}');save();render()">Cập nhật (KTV)</button> <button ${l.x||l.i>=2||s.locked?'disabled':''} onclick="s.labs[${j}].x=1;log('Hủy chỉ định','${l.n}');save();render()">Hủy chỉ định</button></td></tr>`).join('')}</table></div><div class="row"><button class="pr" ${all&&L.some(x=>x.i==3)?'':'disabled'} onclick="s.labs.forEach(x=>{if(!x.x)x.i=4});save();toast('Đã đọc kết quả');render()">Join: bác sĩ xem kết quả</button></div>`:''}</div>
 <div class="card"><b>Hẹn tái khám</b><div class="row"><input type="date" style="max-width:200px" value="${s.fu}" onchange="s.fu=this.value;save()"><button onclick="reex()">Đặt hẹn tái khám</button></div></div>
 <div class="row"><button class="pr" ${dis} onclick="finish()">Hoàn tất khám</button><button onclick="nav(6)">Kê đơn thuốc →</button></div>`});
function addLab(i){s.labs.push({n:LAB[i][0],p:LAB[i][1],i:0});log('Chỉ định xét nghiệm',LAB[i][0]);save();render()}
function finish(){if(!s.dx.trim())return toast('Vui lòng nhập chẩn đoán');if(s.labs.some(l=>l.i<3&&!l.x))return toast('Chờ đủ kết quả xét nghiệm (join)');s.locked=true;s.ver.push({n:s.ver.length+1,t:new Date().toLocaleTimeString('vi-VN')});s.ap.find(x=>x.id==s.cur).st='Hoàn thành';log('Khóa bệnh án',s.cur);save();toast('Đã lưu bệnh án có dấu thời gian và khóa');render()}
function reex(){if(!s.fu)return toast('Chọn ngày tái khám');const a=s.ap.find(x=>x.id==s.cur),t=T.find(t=>!bk(a.doc,s.fu,t));if(!t)return toast('Ngày này đã kín lịch');const n=addAp(a.doc,a.spec,s.fu,t,'Tái khám','Chờ xác nhận');s.sms.push({a:n.id,st:'SENT'});log('Hẹn tái khám',n.id);save();toast('Đã hẹn tái khám lúc '+t+' và gửi SMS nhắc lịch')}

</script></body></html>
