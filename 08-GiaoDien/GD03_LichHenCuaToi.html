<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lịch hẹn · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(3,()=>{const list=s.ap.filter(a=>(s.role==='lt'||a.patientId===PATIENT.id)&&(s.filter==='Tất cả'||a.status===s.filter));return `<div class="card"><div class="heading-row"><h2>${s.role==='lt'?'Quản lý tiếp đón và lịch hẹn':'Lịch hẹn của tôi'}</h2><button class="btn btn-primary btn-small" onclick="go(2)">+ Đặt lịch mới</button></div><div class="grid2"><div><label for="status">Lọc theo trạng thái</label><select id="status" onchange="s.filter=this.value;save();render()">${options(['Tất cả','Chờ xác nhận','Đã đặt','Đã đến','Hoàn thành','Đã hủy','Không đến','Danh sách chờ'],s.filter)}</select></div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Mã lịch</th><th>Bác sĩ</th><th>Ngày – giờ</th><th>Lý do</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${a.id}</b></td><td>${escapeHTML(a.doctor)}<div class="small">${escapeHTML(a.spec)}</div></td><td>${dateVI(a.date)}<br><b>${a.time}</b></td><td>${escapeHTML(a.reason)}</td><td>${pill(a.status)}</td><td>${actionsFor(a)}</td></tr>`).join('')||'<tr><td class="table-empty" colspan="6">Không có lịch hẹn phù hợp.</td></tr>'}</tbody></table></div></div>${s.role==='bn'?patientRecord():msgBox('Lễ tân chỉ được xem thông tin đặt lịch và check-in, không được xem chẩn đoán hoặc đơn thuốc của bệnh nhân.','info')}`});
function actionsFor(a){const p=`'${a.id}'`;if(!CAN_CHANGE.includes(a.status)&&a.status!=='Danh sách chờ')return '<span class="muted">—</span>';const controls=[];if(s.role==='lt'&&a.status==='Chờ xác nhận')controls.push(`<button class="btn btn-primary btn-small" onclick="confirmAp(${p})">Xác nhận</button>`);if(s.role==='lt'&&a.status==='Đã đặt')controls.push(`<button class="btn btn-primary btn-small" onclick="checkIn(${p})">Check-in</button>`);if(s.role==='lt'&&a.status==='Đã đặt')controls.push(`<button class="btn btn-small" onclick="noShow(${p})">Không đến</button>`);if(CAN_CHANGE.includes(a.status))controls.push(`<button class="btn btn-small" onclick="changeAp(${p})">Đổi lịch</button>`);controls.push(`<button class="btn btn-danger btn-small" onclick="cancelAp(${p})">Hủy</button>`);return `<div class="actions">${controls.join('')}</div>`}
function confirmAp(id){if(s.role!=='lt')return;const a=apById(id);if(!a||a.status!=='Chờ xác nhận')return notify('Không thể xác nhận lịch này');a.status='Đã đặt';audit('Xác nhận lịch',id);save();render()}
function changeAp(id){const a=apById(id);if(!a||!CAN_CHANGE.includes(a.status))return notify('Không thể đổi lịch');s.draft={spec:a.spec,doctor:a.doctor,date:a.date,time:'',reason:a.reason,editId:id};go(2)}
function cancelAp(id){const a=apById(id);if(!a||!(CAN_CHANGE.includes(a.status)||a.status==='Danh sách chờ'))return notify('Không thể hủy lịch đã tiếp đón');if(!confirm('Xác nhận hủy lịch '+id+'?'))return;a.status='Đã hủy';audit('Hủy lịch',id);promoteWaitlist(a.doctor,a.date,a.time);save();render()}
function checkIn(id){if(s.role!=='lt')return;const a=apById(id);if(!a||a.status!=='Đã đặt')return notify('Lịch chưa ở trạng thái đã đặt');if(a.date!==TODAY)return notify('Chỉ check-in lịch trong ngày hiện tại ('+dateVI(TODAY)+')');a.status='Đã đến';audit('Tiếp đón / check-in',id);save();go(4,'Đã tiếp đón bệnh nhân, chuyển vào danh sách chờ khám')}
function noShow(id){if(s.role!=='lt')return;const a=apById(id);if(!a||a.status!=='Đã đặt')return;if(a.date>TODAY)return notify('Chưa thể đánh dấu không đến cho lịch trong tương lai');if(!confirm('Đánh dấu bệnh nhân không đến?'))return;a.status='Không đến';audit('Không đến khám',id);promoteWaitlist(a.doctor,a.date,a.time);save();render()}
function patientRecord(){const records=Object.entries(s.visits).filter(([id,v])=>v.closed&&apById(id)?.patientId===PATIENT.id);return `<div class="card"><div class="heading-row"><h2>Hồ sơ khám của bệnh nhân mẫu</h2>${pill('Chỉ bệnh nhân')}</div>${records.length?records.map(([id,v])=>`<div class="summary"><b>${escapeHTML(id)} · ${dateVI(apById(id).date)}</b><p>Triệu chứng: ${escapeHTML(v.symptoms||'—')}<br>Chẩn đoán: ${escapeHTML(v.diagnosis||'—')}<br>Đơn thuốc: ${v.rx.length?v.rx.map(r=>escapeHTML(MEDICINES.find(m=>m.id===r.medId)?.name)).join(', '):'Không kê đơn'}<br>Tái khám: ${dateVI(v.followup)}</p></div>`).join(''):empty('Chưa có lượt khám hoàn thành.')}<p class="muted">Thông tin trên là dữ liệu bệnh nhân mẫu, không phải bệnh án thật.</p></div>`}
</script></body></html>
