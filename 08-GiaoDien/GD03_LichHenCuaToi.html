<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD03 – Lịch hẹn của tôi</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
const cls=st=>({'Đã hủy':'x','Không đến':'x','Chờ xác nhận':'w','Danh sách chờ':'w','Hoàn thành':'g','Đã đến':'g'}[st]||'');
layout(3,()=>{const L=s.ap.filter(a=>s.flt=='Tất cả'||a.st==s.flt);return `<h2>3. Lịch hẹn của tôi</h2><div class="card"><label>Lọc theo trạng thái</label><select onchange="s.flt=this.value;save();render()">${opts(['Tất cả','Chờ xác nhận','Đã đặt','Đã đến','Hoàn thành','Đã hủy','Không đến','Danh sách chờ'],s.flt)}</select><div class="tw"><table><tr><th>Mã</th><th>Bác sĩ</th><th>Ngày giờ</th><th>Lý do</th><th>Trạng thái</th><th></th></tr>${L.map(a=>`<tr><td>${a.id}</td><td>${a.doc}</td><td>${a.date} ${a.time}</td><td>${a.reason}</td><td><span class="tag ${cls(a.st)}">${a.st}</span></td><td>${act(a)}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Không có lịch hẹn</td></tr>'}</table></div></div>${rec()}`});
function act(a){const i=`'${a.id}'`,c=`<button onclick="cancel(${i})">Hủy</button> `;
 if(a.st=='Chờ xác nhận')return `<button class="pr" onclick="setSt(${i},'Đã đặt')">Xác nhận</button> `+c;
 if(a.st=='Đã đặt')return `<button class="pr" onclick="checkin(${i})">Check-in</button> <button onclick="resched(${i})">Đổi lịch</button> `+c+`<button onclick="setSt(${i},'Không đến')">Không đến</button>`;return a.st=='Danh sách chờ'?c:''}
function setSt(id,st){const a=s.ap.find(x=>x.id==id);a.st=st;if(st=='Không đến'){delete s.taken[k(a)];promote()}log('Cập nhật lịch '+st,id);save();render()}
function cancel(id){const a=s.ap.find(x=>x.id==id),w=a.st=='Danh sách chờ';a.st='Đã hủy';if(!w)delete s.taken[k(a)];log('Hủy lịch',id);save();toast('Đã hủy, khung giờ được giải phóng và báo cho bác sĩ');promote();render()}
function resched(id){const a=s.ap.find(x=>x.id==id);s.b={spec:a.spec,doc:a.doc,date:a.date,slot:'',reason:a.reason,re:id};nav(2)}
function checkin(id){setSt(id,'Đã đến');s.q.push(id);save();toast('Đã check-in, vào hàng chờ')}
function rec(){if(s.role=='lt')return '<div class="card mu">🔒 Lễ tân không có quyền xem chẩn đoán trong hồ sơ bệnh án.</div>';if(!s.locked)return '<div class="card"><b>Hồ sơ bệnh án của tôi</b><p class="mu">Chưa có lượt khám hoàn tất.</p></div>';return `<div class="card"><b>Hồ sơ bệnh án của tôi</b> <span class="tag g">Phiên bản ${s.ver.length}</span><p>Chẩn đoán: ${s.dx}<br>Triệu chứng: ${s.sym||'—'}<br>Xét nghiệm: ${s.labs.filter(l=>!l.x).map(l=>l.n).join(', ')||'—'}<br>Đơn thuốc: ${s.rx.map(x=>MED[x.i][0]).join(', ')||'—'}${s.fu?'<br>Tái khám: '+s.fu:''}</p><div class="mu">${s.ver.map(v=>'v'+v.n+' · '+v.t).join(' | ')}</div></div>`}

</script></body></html>
