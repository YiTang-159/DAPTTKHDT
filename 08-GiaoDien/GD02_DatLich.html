<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt lịch khám · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(2,()=>{const d=s.draft;const editing=!!d.editId;return `<div class="card"><div class="heading-row"><h2>${editing?'Đổi lịch '+escapeHTML(d.editId):'Chọn thông tin đặt lịch'}</h2>${editing?`<button class="btn btn-small" onclick="cancelEdit()">Thoát đổi lịch</button>`:''}</div><div class="grid3"><div class="form-field"><label for="specialty">Chuyên khoa</label><select id="specialty" onchange="setDraft('spec',this.value)">${options(Object.keys(DOCTORS),d.spec)}</select></div><div class="form-field"><label for="doctor">Bác sĩ</label><select id="doctor" onchange="setDraft('doctor',this.value)">${options(DOCTORS[d.spec],d.doctor)}</select></div><div class="form-field"><label for="day">Ngày khám</label><input id="day" type="date" min="${TODAY}" value="${escapeHTML(d.date)}" onchange="setDraft('date',this.value)"></div></div><label>Khung giờ làm việc</label><p class="hint">Chọn giờ còn trống; giờ đã kín có thể đăng ký danh sách chờ.</p><div class="slots">${TIMES.map(time=>`<button type="button" class="slot ${d.time===time?'active':''} ${isTaken(d.doctor,d.date,time,d.editId)?'busy':''}" onclick="chooseTime('${time}')">${time}<small>${isTaken(d.doctor,d.date,time,d.editId)?'Đã có lịch':'Còn trống'}</small></button>`).join('')}</div><label for="reason">Lý do khám</label><textarea id="reason" placeholder="Nhập lý do khám ngắn gọn" oninput="s.draft.reason=this.value;save()">${escapeHTML(d.reason)}</textarea><label class="checkline"><input type="checkbox" ${s.smsFail?'checked':''} onchange="s.smsFail=this.checked;save()"> Mô phỏng dịch vụ SMS bị gián đoạn</label><div class="actions"><button class="btn btn-primary" onclick="submitBook()">${editing?'Xác nhận đổi lịch':'Xác nhận đặt lịch'}</button>${s.role==='lt'?'<span class="muted">Lễ tân có thể đặt lịch hộ bệnh nhân.</span>':''}</div></div><div class="card"><h2>Thông tin lưu ý</h2><div class="grid2"><div>${msgBox('Khi xác nhận, hệ thống sẽ kiểm tra trùng khung giờ một lần nữa.','info')}</div><div>${msgBox('Bệnh nhân hiện tại: '+PATIENT.name+'.','warning')}</div></div></div>`});
function setDraft(field,value){if(field==='spec'){s.draft.spec=value;s.draft.doctor=DOCTORS[value][0];s.draft.time=''}else if(field==='doctor'||field==='date'){s.draft[field]=value;s.draft.time=''}else s.draft[field]=value;save();render()}
function cancelEdit(){s.draft={spec:'Nội tổng quát',doctor:DOCTORS['Nội tổng quát'][0],date:tomorrow,time:'',reason:'',editId:null};save();render()}
function chooseTime(time){s.draft.time=time;save();render();if(isTaken(s.draft.doctor,s.draft.date,time,s.draft.editId))notify('Khung giờ đã kín. Có thể đăng ký vào danh sách chờ.')}
function submitBook(){const d=s.draft;if(!d.date||d.date<TODAY)return notify('Vui lòng chọn ngày khám từ hôm nay trở đi.');if(!d.time)return notify('Vui lòng chọn khung giờ.');
// Đọc lại dữ liệu lưu cục bộ để giảm nguy cơ ghi đè giữa hai tab (không phải cơ chế khóa giao dịch).
try{const latest=JSON.parse(localStorage.getItem(STORE));if(latest?.v===2&&Array.isArray(latest.ap)){s.ap=latest.ap;s.nextAp=Math.max(s.nextAp,latest.nextAp||1)}}catch(_){}
const original=d.editId?apById(d.editId):null;if(d.editId&&(!original||!CAN_CHANGE.includes(original.status)))return notify('Lịch hẹn không còn đủ điều kiện đổi.');const occupied=isTaken(d.doctor,d.date,d.time,d.editId);if(occupied&&original)return notify('Khung giờ mới đã kín. Vui lòng chọn khung giờ khác.');if(occupied){if(!confirm('Khung giờ đã kín. Thêm vào danh sách chờ?'))return;const a=createAppointment(d,'Danh sách chờ');s.draft.time='';s.draft.reason='';save();go(3,`Đã đưa lịch ${a.id} vào danh sách chờ`);return}
if(original){const old={doctor:original.doctor,date:original.date,time:original.time};Object.assign(original,{doctor:d.doctor,spec:d.spec,date:d.date,time:d.time,reason:d.reason.trim()||'Khám sức khỏe',status:'Chờ xác nhận'});audit('Đổi lịch hẹn',original.id);sendSMS(original.id);promoteWaitlist(old.doctor,old.date,old.time)}else{const a=createAppointment(d);sendSMS(a.id)}s.draft={spec:d.spec,doctor:d.doctor,date:d.date,time:'',reason:'',editId:null};save();go(3,s.smsFail?'Đã lưu lịch; SMS đang chờ gửi lại':'Lịch hẹn đã tạo và gửi thông báo xác nhận')}
</script></body></html>
