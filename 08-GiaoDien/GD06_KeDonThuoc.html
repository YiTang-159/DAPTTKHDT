<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kê đơn thuốc · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(6,()=>{const v=currentVisit(),a=activeAp();if(!v||!a)return `<div class="card">${empty('Hãy mở một lượt khám từ màn hình Danh sách chờ trước khi kê đơn.')}<div class="actions"><button class="btn btn-primary" onclick="go(4)">Mở danh sách chờ</button></div></div>`;const locked=v.rxIssued||v.closed;return `<div class="card"><div class="record-header"><div><span class="person">${escapeHTML(PATIENT.name)}</span><div class="muted">${a.id} · ${escapeHTML(a.doctor)}</div></div>${pill(v.rxIssued?'Đã phát hành đơn':'Đơn nháp')}</div>${msgBox('Cảnh báo dị ứng: '+PATIENT.allergy+'. Thông tin cảnh báo này chỉ đối chiếu một nhóm dị ứng, không thay thế việc kiểm tra lâm sàng.','warning')}<div class="grid3"><div><label for="medicine">Thuốc trong danh mục</label><select id="medicine" ${locked?'disabled':''}><option value="">-- Chọn thuốc --</option>${MEDICINES.map(m=>`<option value="${m.id}" ${m.active?'':'disabled'}>${escapeHTML(m.name)}${m.active?'':' (ngừng cung cấp)'}</option>`).join('')}</select></div><div><label for="dosage">Hướng dẫn sử dụng</label><input id="dosage" value="Sáng 1 viên, sau ăn" ${locked?'disabled':''}></div><div><label for="qty">Số lượng</label><input id="qty" type="number" min="1" max="1000" value="10" ${locked?'disabled':''}></div></div><div class="actions"><button class="btn btn-primary" ${locked?'disabled':''} onclick="addMedicine()">+ Thêm thuốc vào đơn</button></div></div><div class="card"><div class="heading-row"><h2>Chi tiết đơn thuốc</h2><span class="muted">${v.rx.length} loại thuốc</span></div><div class="table-wrap"><table><thead><tr><th>Thuốc</th><th>Liều dùng</th><th>Số lượng</th><th>Tạm tính</th><th></th></tr></thead><tbody>${v.rx.map((r,i)=>{const med=MEDICINES.find(m=>m.id===r.medId);return `<tr><td>${escapeHTML(med.name)}</td><td>${escapeHTML(r.dosage)}</td><td>${r.qty}</td><td>${money(med.price*r.qty)}</td><td><button class="btn btn-danger btn-small" ${locked?'disabled':''} onclick="removeMedicine(${i})">Xóa</button></td></tr>`}).join('')||'<tr><td colspan="5" class="table-empty">Chưa có thuốc trong đơn.</td></tr>'}</tbody></table></div><div class="actions"><button class="btn btn-primary" ${locked||!v.rx.length?'disabled':''} onclick="issuePrescription()">${v.rxIssued?'Đã phát hành':'Phát hành đơn thuốc'}</button><button class="btn btn-outline" onclick="go(5)">← Quay lại khám bệnh</button></div><p class="hint">Sau khi phát hành, đơn thuốc mẫu không cho chỉnh sửa. Cần hoàn tất khám trước khi thu ngân thanh toán.</p></div>`});
function addMedicine(){if(s.role!=='bs')return;const v=currentVisit();if(!v||v.rxIssued||v.closed)return;const med=MEDICINES.find(m=>m.id===$('medicine').value),dosage=$('dosage').value.trim(),qty=Number($('qty').value);if(!med)return notify('Vui lòng chọn thuốc');if(!med.active)return notify('Thuốc đã ngừng cung cấp');if(!Number.isInteger(qty)||qty<1||qty>1000)return notify('Số lượng thuốc phải từ 1 đến 1000');if(!dosage)return notify('Vui lòng nhập hướng dẫn sử dụng');if(med.allergy&&med.allergy===PATIENT.allergy)return notify('Không thể kê thuốc vì trùng nhóm dị ứng đã khai báo');v.rx.push({medId:med.id,dosage,qty});audit('Thêm thuốc vào đơn',med.id+' · '+v.id);save();render()}
function removeMedicine(i){const v=currentVisit();if(!v||v.rxIssued||v.closed)return;v.rx.splice(i,1);audit('Xóa thuốc trong đơn',v.id);save();render()}
function issuePrescription(){if(s.role!=='bs')return;const v=currentVisit();if(!v||v.closed||v.rxIssued||!v.rx.length)return;v.rxIssued=true;audit('Phát hành đơn thuốc',v.id);save();render();notify('Đã phát hành đơn thuốc mẫu')}
</script></body></html>
