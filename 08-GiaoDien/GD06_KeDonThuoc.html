<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD06 – Kê đơn thuốc</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(6,()=>{if(!s.cur)return '<h2>6. Kê đơn thuốc</h2><div class="card mu">Chọn bệnh nhân từ màn 4 trước.</div>';const w=s.warn;
 return `<h2>6. Kê đơn thuốc</h2><div class="card"><span class="tag x">Dị ứng: ${PT.allergy}</span><div class="g2"><div><label>Tìm thuốc (gõ tên)</label><input id="md" list="ml" placeholder="Gõ tên thuốc"><datalist id="ml">${MED.map(m=>`<option value="${m[0]}">`).join('')}</datalist></div><div><label>Liều dùng</label><input id="ds" value="Sáng 1, tối 1 sau ăn"></div><div><label>Số lượng</label><input id="qt" type="number" min="1" value="10"></div></div><div class="row"><button class="pr" ${s.rxOk?'disabled':''} onclick="addRx()">Thêm thuốc</button></div>${w?`<div class="warn"><b>Cảnh báo dị ứng:</b> bệnh nhân dị ứng ${PT.allergy}, ${MED[w.i][0]} thuộc nhóm này.<div class="row"><button onclick="pushRx(s.warn)">Vẫn kê</button><button onclick="s.warn=null;save();render()">Đổi thuốc</button></div></div>`:''}</div>
 <div class="card"><div class="tw"><table><tr><th>Thuốc</th><th>Liều</th><th>SL</th><th></th></tr>${s.rx.map((r,i)=>`<tr><td>${MED[r.i][0]}</td><td>${r.ds}</td><td>${r.q}</td><td><button ${s.rxOk?'disabled':''} onclick="s.rx.splice(${i},1);save();render()">Xóa</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">Chưa có thuốc</td></tr>'}</table></div><div class="row"><button class="pr" ${s.rx.length&&!s.rxOk?'':'disabled'} onclick="s.rxOk=true;log('Phát hành đơn thuốc',s.cur);save();toast('Đã phát hành đơn (có thể in)');render()">${s.rxOk?'Đã phát hành':'Phát hành đơn'}</button>${s.rxOk?'<button onclick="nav(7)">Thanh toán →</button>':''}</div></div>`});
function addRx(){const v=$('md').value.trim().toLowerCase(),i=v?MED.findIndex(x=>x[0].toLowerCase().includes(v)):-1;if(i<0)return toast('Không tìm thấy thuốc trong danh mục');const m=MED[i],o={i,ds:$('ds').value,q:+$('qt').value||1};
 if(m[2]=='x')return toast('Thuốc không còn trong danh mục, vui lòng chọn thuốc khác');if(m[2]==PT.allergy){s.warn=o;save();return render()}pushRx(o)}
function pushRx(o){s.rx.push(o);s.warn=null;save();render()}

</script></body></html>
