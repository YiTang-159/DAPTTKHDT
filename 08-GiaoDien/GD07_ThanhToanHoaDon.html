<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thanh toán và hóa đơn · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(7,()=>{const eligible=s.ap.filter(a=>visitFor(a.id)?.closed);if(!eligible.length)return `<div class="card">${empty('Chưa có lượt khám hoàn thành để thanh toán. Bác sĩ cần hoàn tất khám trước.')}</div>`;const id=eligible.some(a=>a.id===s.billingId)?s.billingId:eligible[0].id;s.billingId=id;const a=apById(id),inv=invoiceFor(id),items=inv?.lines||billLines(id),amount=inv?.total??total(items);return `<div class="card no-print"><div class="heading-row"><h2>Chọn lượt khám để thanh toán</h2>${inv?pill(inv.status):pill('Chưa thanh toán')}</div><label for="bill">Lượt khám đã hoàn thành</label><select id="bill" onchange="s.billingId=this.value;s.cash='';save();render()">${eligible.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.id} – ${dateVI(x.date)} – ${escapeHTML(x.doctor)}</option>`).join('')}</select></div><div class="card printable" id="receipt"><div class="print-header">PHÒNG KHÁM ĐA KHOA<br>PHIẾU THU MẪU – KHÔNG CÓ GIÁ TRỊ THANH TOÁN</div><div class="record-header"><div><h2 style="margin:0">Chi tiết thanh toán</h2><div class="muted">Bệnh nhân mẫu: ${escapeHTML(PATIENT.name)} · ${PATIENT.id}<br>Lượt khám: ${id}</div></div>${inv?pill(inv.status):pill('Chưa thanh toán')}</div><div class="table-wrap"><table><thead><tr><th>Khoản mục</th><th>Thành tiền</th></tr></thead><tbody>${items.map(line=>`<tr><td>${escapeHTML(line.name)}</td><td>${money(line.price)}</td></tr>`).join('')}<tr><th>TỔNG CỘNG</th><th>${money(amount)}</th></tr></tbody></table></div>${inv?`<div class="summary"><div class="summary-line"><span>Mã phiếu thu</span><b>${inv.id}</b></div><div class="summary-line"><span>Hình thức</span><b>${escapeHTML(inv.method)}</b></div><div class="summary-line"><span>Thời gian thanh toán</span><b>${escapeHTML(inv.paidAt)}</b></div></div>`:''}</div><div class="card no-print"><h2>Thực hiện thanh toán</h2>${inv?msgBox('Lượt khám đã được thanh toán. Có thể in phiếu thu mẫu.','success'):`<div class="grid2"><div><label for="method">Phương thức thanh toán</label><select id="method" onchange="changeMethod(this.value)">${options(['Tiền mặt','Thẻ (mô phỏng)','Chuyển khoản (mô phỏng)','Ví điện tử (mô phỏng)'],s.paymentMethod)}</select></div>${s.paymentMethod==='Tiền mặt'?`<div><label for="cash">Số tiền khách đưa (VND)</label><input id="cash" type="number" min="0" step="1000" value="${escapeHTML(s.cash)}" oninput="s.cash=this.value;save();showChange(${amount})"><p class="hint">Tiền thối: <b id="change">${money(Math.max(0,Number(s.cash)-amount))}</b></p></div>`:`<div><label class="checkline" style="margin-top:37px"><input type="checkbox" ${s.paymentFail?'checked':''} onchange="s.paymentFail=this.checked;save()"> Mô phỏng cổng thanh toán trả về lỗi</label><p class="hint">Không gọi API thanh toán thực tế hoặc trừ tiền.</p></div>`}</div><div class="actions"><button class="btn btn-primary" onclick="charge()">Xác nhận thanh toán</button></div>`}<div class="actions"><button class="btn btn-outline" ${inv?'':'disabled'} onclick="window.print()">In phiếu thu mẫu</button></div></div>`});
function changeMethod(value){s.paymentMethod=value;s.cash='';save();render()}
function showChange(t){const box=$('change');if(box)box.textContent=money(Math.max(0,(Number(s.cash)||0)-t))}
function charge(){if(s.role!=='tn')return;const id=s.billingId,a=apById(id),v=visitFor(id);if(!a||!v?.closed)return notify('Chưa có lượt khám hợp lệ');if(invoiceFor(id))return notify('Lượt khám đã được thanh toán');const items=billLines(id),amount=total(items);if(s.paymentMethod==='Tiền mặt'&&(!s.cash||Number(s.cash)<amount))return notify('Số tiền khách đưa chưa đủ để thanh toán');if(s.paymentMethod!=='Tiền mặt'&&s.paymentFail){audit('Giao dịch thanh toán mô phỏng thất bại',id);save();render();notify('Cổng thanh toán mô phỏng báo lỗi. Vui lòng thử lại hoặc đổi phương thức.');return}const inv={id:'HD'+String(s.nextInvoice++).padStart(3,'0'),appointmentId:id,lines:items,total:amount,method:s.paymentMethod,paidAt:stamp(),status:'Đã thanh toán'};s.invoices.unshift(inv);audit('Thanh toán và lập phiếu thu',id+' · '+inv.id);s.cash='';save();render();notify('Thanh toán thành công (mô phỏng), đã tạo phiếu thu')}
</script></body></html>
