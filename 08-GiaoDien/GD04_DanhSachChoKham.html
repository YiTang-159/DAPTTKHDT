<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Danh sách chờ khám · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(4,()=>{const queue=s.ap.filter(a=>a.status==='Đã đến').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));return `<div class="card"><div class="heading-row"><h2>Hàng chờ khám bệnh</h2><span>${pill(queue.length+' bệnh nhân')}</span></div><div class="table-wrap"><table><thead><tr><th>STT</th><th>Bệnh nhân</th><th>Mã lịch</th><th>Khung giờ</th><th>Bác sĩ</th><th>Thao tác</th></tr></thead><tbody>${queue.map((a,i)=>`<tr><td><b>${i+1}</b></td><td>${escapeHTML(PATIENT.name)}<div class="small">${escapeHTML(PATIENT.id)}</div></td><td>${escapeHTML(a.id)}</td><td>${dateVI(a.date)} · ${a.time}</td><td>${escapeHTML(a.doctor)}</td><td>${s.role==='bs'?`<button class="btn btn-primary btn-small" onclick="beginVisit('${a.id}')">${visitFor(a.id)?'Tiếp tục khám':'Bắt đầu khám'}</button>`:pill('Chờ bác sĩ')}</td></tr>`).join('')||'<tr><td colspan="6" class="table-empty">Chưa có bệnh nhân nào check-in.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Hướng dẫn quy trình</h2><p class="muted">Lễ tân xác nhận lịch và làm thủ tục check-in tại màn hình <b>Lịch hẹn</b>. Bác sĩ mở lượt khám từ danh sách này. Kỹ thuật viên cập nhật xét nghiệm tại màn hình Khám bệnh và xét nghiệm.</p>${s.role==='lt'?`<div class="actions"><button class="btn btn-outline" onclick="go(3)">Đi tới Lịch hẹn →</button></div>`:''}</div>`});
function beginVisit(id){if(s.role!=='bs')return;const a=apById(id);if(!a||a.status!=='Đã đến')return notify('Bệnh nhân chưa check-in hoặc lượt khám đã hoàn tất');createVisit(id);s.activeVisit=id;audit('Mở lượt khám',id);go(5)}
</script></body></html>
