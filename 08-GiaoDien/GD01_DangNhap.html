<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập · Phòng khám đa khoa</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
const ALIASES={bn:'user1',lt:'user2',bs:'user3',ktv:'user4',tn:'user5',ql:'user6'};
layout(1,()=>`<div class="login-hero"><section class="hero-left"><h2>Quản lý phòng khám<br>thuận tiện và rõ ràng</h2><p>Quản lý lịch hẹn, hồ sơ khám bệnh và thanh toán tại một nơi.</p><ul><li>Đặt lịch và tiếp đón bệnh nhân</li><li>Khám bệnh, xét nghiệm và kê đơn</li><li>Thanh toán, hóa đơn và báo cáo</li><li>Phân quyền theo vai trò</li></ul></section><section class="card login-card"><h2>Chào mừng trở lại</h2><p class="intro">Đăng nhập để truy cập các chức năng phù hợp với vai trò.</p><form onsubmit="return login(event)" novalidate><label for="username">Tài khoản</label><input id="username" autocomplete="username" placeholder="Ví dụ: bn hoặc user1" spellcheck="false" required><label for="password">Mật khẩu</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><button type="button" class="btn btn-small" id="toggle" onclick="togglePassword()" aria-label="Hiện mật khẩu">Hiện</button></div><p id="login-error" class="error-text" role="alert" hidden></p><div class="actions"><button class="btn btn-primary btn-block" type="submit">Đăng nhập</button></div></form><details class="account-details"><summary>Thông tin tài khoản truy cập</summary><p class="muted">Mật khẩu chung: <b>123456</b>.</p><div class="table-wrap"><table><thead><tr><th>Đăng nhập</th><th>Vai trò</th></tr></thead><tbody>${Object.entries(ALIASES).map(([key,u])=>`<tr><td><code>${key}</code> / ${u}</td><td>${roleName(s.accounts.find(a=>a.u===u)?.role)}</td></tr>`).join('')}</tbody></table></div></details><div class="actions"><button class="btn btn-small" type="button" onclick="resetData()">Khôi phục dữ liệu mẫu</button><button class="btn btn-small" type="button" onclick="notify('Chưa hỗ trợ lấy lại mật khẩu. Vui lòng liên hệ quản trị viên.')">Quên mật khẩu?</button></div></section></div>`);
function togglePassword(){const input=$('password'),button=$('toggle');input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'Hiện':'Ẩn';button.setAttribute('aria-label',input.type==='password'?'Hiện mật khẩu':'Ẩn mật khẩu')}
function login(event){event.preventDefault();const name=$('username').value.trim().toLowerCase(),pw=$('password').value,e=$('login-error');e.hidden=true;if(!name||!pw){e.textContent='Vui lòng nhập đủ tài khoản và mật khẩu.';e.hidden=false;return false}const a=s.accounts.find(x=>x.u===(ALIASES[name]||name));if(!a||pw!=='123456'){e.textContent='Tài khoản hoặc mật khẩu không đúng.';e.hidden=false;return false}if(a.locked){e.textContent='Tài khoản đang bị thu hồi quyền truy cập.';e.hidden=false;return false}if(!ROLES[a.role]){e.textContent='Tài khoản chưa có vai trò hợp lệ.';e.hidden=false;return false}s.user=a.u;s.role=a.role;audit('Đăng nhập');go(ROLES[a.role].pages[0],'Đăng nhập thành công');return false}
</script></body></html>
