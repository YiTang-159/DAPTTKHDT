<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản trị phòng khám · Phòng khám</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
const TABS={accounts:'Tài khoản',roles:'Ma trận quyền',schedule:'Lịch làm việc',logs:'Nhật ký',sms:'SMS/email',report:'Báo cáo'};
layout(8,()=>{const effective=s.ap.filter(a=>RESERVED.includes(a.status)).length,queued=s.ap.filter(a=>a.status==='Đã đến').length,closed=Object.values(s.visits).filter(v=>v.closed).length,revenue=s.invoices.reduce((sum,x)=>sum+x.total,0);return `<div class="metrics"><div class="metric"><div class="number">${effective}</div><div class="lbl">Lịch đang hiệu lực</div></div><div class="metric"><div class="number">${queued}</div><div class="lbl">Đang chờ khám</div></div><div class="metric"><div class="number">${closed}</div><div class="lbl">Lượt khám hoàn thành</div></div><div class="metric"><div class="number">${money(revenue)}</div><div class="lbl">Doanh thu mẫu đã thu</div></div></div><div class="card"><div class="tabs">${Object.entries(TABS).map(([key,label])=>`<button class="btn btn-small ${s.tab===key?'selected':''}" onclick="s.tab='${key}';save();render()">${label}</button>`).join('')}</div>${tabContent()}</div>`});
function tabContent(){if(s.tab==='accounts')return `<h2>Quản lý tài khoản và trạng thái truy cập</h2><div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${s.accounts.map(a=>`<tr><td><b>${escapeHTML(a.u)}</b></td><td><select aria-label="Vai trò ${a.u}" onchange="assignRole('${a.u}',this.value)">${Object.keys(ROLES).map(r=>`<option value="${r}" ${r===a.role?'selected':''}>${escapeHTML(roleName(r))}</option>`).join('')}</select></td><td>${pill(a.locked?'Đã khóa':'Đang hoạt động')}</td><td><button class="btn btn-small ${a.locked?'':'btn-danger'}" ${a.u===s.user?'disabled':''} onclick="toggleLock('${a.u}')">${a.locked?'Cấp lại quyền':'Thu hồi quyền'}</button></td></tr>`).join('')}</tbody></table></div><p class="hint">Không thể khóa chính tài khoản đang quản trị trong phiên hiện tại.</p>`;
if(s.tab==='roles')return `<h2>Ma trận phân quyền giao diện (RBAC)</h2><div class="table-wrap"><table><thead><tr><th>Vai trò</th><th>Trang được truy cập</th><th>Chức năng</th></tr></thead><tbody>${Object.entries(ROLES).map(([role,r])=>`<tr><td><b>${escapeHTML(r.name)}</b></td><td>${r.pages.map(p=>escapeHTML(PAGE_NAMES[p])).join(', ')}</td><td>${role==='bn'?'Đặt, xem, đổi, hủy lịch của bệnh nhân mẫu':role==='lt'?'Tiếp đón, xác nhận lịch, check-in':role==='bs'?'Khám, chỉ định, xem xét nghiệm, kê đơn':role==='ktv'?'Cập nhật trạng thái, nhập kết quả xét nghiệm':role==='tn'?'Thanh toán, in phiếu thu mẫu':'Tài khoản, nhật ký, báo cáo'}</td></tr>`).join('')}</tbody></table></div>`;
if(s.tab==='schedule')return `<h2>Danh sách lịch làm việc của bác sĩ</h2><div class="table-wrap"><table><thead><tr><th>Bác sĩ</th><th>Chuyên khoa</th><th>Lịch làm việc mẫu</th></tr></thead><tbody>${Object.entries(DOCTORS).flatMap(([spec,docs])=>docs.map(doc=>`<tr><td>${escapeHTML(doc)}</td><td>${escapeHTML(spec)}</td><td>Thứ 2 – Thứ 6, 08:00 – 11:00</td></tr>`)).join('')}</tbody></table></div><p class="hint">Lịch làm việc hiển thị theo khung giờ của từng bác sĩ.</p>`;
if(s.tab==='logs')return `<h2>Nhật ký thao tác</h2><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Tài khoản</th><th>Vai trò</th><th>Hành động</th><th>Đối tượng</th></tr></thead><tbody>${s.logs.map(l=>`<tr><td>${escapeHTML(l.at)}</td><td>${escapeHTML(l.who)}</td><td>${escapeHTML(l.role)}</td><td>${escapeHTML(l.action)}</td><td>${escapeHTML(l.subject)}</td></tr>`).join('')||'<tr><td colspan="5" class="table-empty">Chưa có nhật ký.</td></tr>'}</tbody></table></div>`;
if(s.tab==='sms')return `<h2>Hàng đợi SMS/email</h2><div class="table-wrap"><table><thead><tr><th>Lịch</th><th>Thời gian</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${s.sms.map((n,i)=>`<tr><td>${escapeHTML(n.id)}</td><td>${escapeHTML(n.at)}</td><td>${pill(n.status)}</td><td>${n.status==='Chờ gửi lại'?`<button class="btn btn-primary btn-small" onclick="retrySMS(${i})">Gửi lại</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="table-empty">Chưa có thông báo.</td></tr>'}</tbody></table></div>`;
if(s.tab==='report'){const groups=['Chờ xác nhận','Đã đặt','Đã đến','Hoàn thành','Danh sách chờ','Không đến','Đã hủy'];return `<h2>Thống kê trạng thái lịch hẹn</h2><div class="table-wrap"><table><thead><tr><th>Trạng thái</th><th>Số lượng</th></tr></thead><tbody>${groups.map(st=>`<tr><td>${escapeHTML(st)}</td><td><b>${s.ap.filter(a=>a.status===st).length}</b></td></tr>`).join('')}</tbody></table></div><div class="summary"><div class="summary-line"><span>Hóa đơn đã thanh toán</span><b>${s.invoices.length}</b></div><div class="summary-line total"><span>Tổng doanh thu ghi nhận</span><b>${money(s.invoices.reduce((a,x)=>a+x.total,0))}</b></div></div>`}
return empty('Không tìm thấy mục quản trị.')}
function assignRole(username,role){if(s.role!=='ql'||!ROLES[role])return;const a=s.accounts.find(x=>x.u===username);if(!a)return;if(username===s.user)return notify('Không được đổi vai trò của tài khoản đang quản trị');a.role=role;audit('Thay đổi vai trò',username+' → '+role);save();render()}
function toggleLock(username){if(s.role!=='ql'||username===s.user)return;const a=s.accounts.find(x=>x.u===username);if(!a)return;a.locked=!a.locked;audit(a.locked?'Thu hồi quyền tài khoản':'Kích hoạt tài khoản',username);save();render()}
function retrySMS(index){if(s.role!=='ql')return;const n=s.sms[index];if(!n||n.status!=='Chờ gửi lại')return;n.status='Đã gửi';n.at=stamp();audit('Gửi lại SMS mô phỏng',n.id);save();render()}
</script></body></html>
