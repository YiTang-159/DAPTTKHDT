<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GD08 – Quản trị phân quyền</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
function kpi(){const ap=s.ap.filter(x=>x.st!='Đã hủy').length,w=s.q.filter(id=>s.ap.find(x=>x.id==id).st!='Hoàn thành').length,dn=s.ap.filter(x=>x.st=='Hoàn thành').length,rev=s.paid?lines().reduce((a,x)=>a+x[1],0):0;return `<div class="kpis"><div class="kpi"><b>${ap}</b><span>Lịch hẹn hiệu lực</span></div><div class="kpi"><b>${w}</b><span>Đang chờ khám</span></div><div class="kpi"><b>${dn}</b><span>Ca đã hoàn thành</span></div><div class="kpi"><b>${fmt(rev)}</b><span>Doanh thu đã thu</span></div></div>`}
const TB={tk:'Tài khoản',rb:'Vai trò – quyền',lich:'Lịch bác sĩ',lg:'Nhật ký',sms:'Thông báo SMS',bc:'Báo cáo'};
layout(8,()=>{let h='';
 if(s.tab=='tk')h='<tr><th>Tài khoản</th><th>Vai trò</th><th>Quyền</th></tr>'+s.US.map((x,i)=>`<tr><td>${x.u}</td><td><select onchange="chRole(${i},this.value)">${Object.keys(ROLES).slice(1).map(r=>`<option value="${r}" ${r==x.r?'selected':''}>${ROLES[r].n}</option>`).join('')}</select></td><td><button onclick="lockU(${i})">${x.lock?'Cấp lại quyền':'Thu hồi quyền'}</button></td></tr>`).join('');
 if(s.tab=='rb')h='<tr><th>Quyền</th><th>Bệnh nhân</th><th>Bác sĩ</th><th>Lễ tân</th><th>Thu ngân</th><th>Quản lý</th></tr><tr><td>Xem hồ sơ bệnh án</td><td>Của mình</td><td>BN đang khám</td><td>Không xem chẩn đoán</td><td>✖</td><td>✖</td></tr><tr><td>Đặt/hủy lịch</td><td>✔</td><td>✖</td><td>✔</td><td>✖</td><td>✖</td></tr><tr><td>Kê đơn</td><td>✖</td><td>✔</td><td>✖</td><td>✖</td><td>✖</td></tr><tr><td>Xem hóa đơn</td><td>✖</td><td>✖</td><td>✖</td><td>✔</td><td>✖</td></tr><tr><td>Phân quyền và xem nhật ký</td><td>✖</td><td>✖</td><td>✖</td><td>✖</td><td>✔</td></tr>';
 if(s.tab=='lich')h='<tr><th>Bác sĩ</th><th>Chuyên khoa</th><th>Ngày làm việc</th><th>Giờ</th></tr>'+Object.entries(DOC).flatMap(([c,l])=>l.map(d=>`<tr><td>${d}</td><td>${c}</td><td>Thứ 2 – Thứ 6</td><td>08:00 – 11:00</td></tr>`)).join('');
 if(s.tab=='lg')h='<tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Đối tượng</th></tr>'+(s.logs.map(l=>`<tr><td>${l.t}</td><td>${l.r}</td><td>${l.a}</td><td>${l.o}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Chưa có thao tác</td></tr>');
 if(s.tab=='sms')h='<tr><th>Lịch</th><th>Trạng thái</th><th></th></tr>'+(s.sms.map((x,i)=>`<tr><td>${x.a}</td><td><span class="tag ${x.st=='SENT'?'g':'w'}">${x.st}</span></td><td>${x.st=='RETRYING'?`<button onclick="s.sms[${i}].st='SENT';log('Gửi lại SMS','${x.a}');save();render()">Gửi lại</button>`:''}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">Chưa có thông báo</td></tr>');
 if(s.tab=='bc'){const c=st=>s.ap.filter(a=>a.st==st).length;h='<tr><th>Chỉ số</th><th>Giá trị</th></tr>'+['Chờ xác nhận','Đã đặt','Đã đến','Hoàn thành','Đã hủy','Không đến','Danh sách chờ'].map(x=>`<tr><td>Lịch ${x.toLowerCase()}</td><td>${c(x)}</td></tr>`).join('')}
 return `<h2>8. Quản trị</h2><div class="card"><div class="row" style="margin:0 0 10px">${Object.keys(TB).map(x=>`<button class="${s.tab==x?'on':''}" onclick="s.tab='${x}';save();render()">${TB[x]}</button>`).join('')}</div><div class="tw"><table>${h}</table></div></div>`});
function chRole(i,v){s.US[i].r=v;log('Gán vai trò '+ROLES[v].n,s.US[i].u);save();toast('Đã gán vai trò và ghi nhật ký');render()}
function lockU(i){const x=s.US[i];x.lock=!x.lock;log(x.lock?'Thu hồi quyền':'Cấp lại quyền',x.u);save();render()}

</script></body></html>
